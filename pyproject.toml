[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrocq"
version = "0.4.1"
description = "Compositional axiom-aware relation packages and Coq kernel replay"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Peng Wang", email = "peng.wang@siat.ac.cn"},
  {name = "Kaiyuan Qi"},
  {name = "Bingheng Yan"}
]
keywords = ["Coq", "proof transfer", "dependent type theory", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
autotrocq = "autotrocq.cli:main"

[project.urls]
Repository = "https://github.com/WilliamWangPeng/AutoTrocq"
Documentation = "https://github.com/WilliamWangPeng/AutoTrocq/blob/main/ARTIFACT.md"
Releases = "https://github.com/WilliamWangPeng/AutoTrocq/releases"

[tool.setuptools.packages.find]
where = ["src"]
