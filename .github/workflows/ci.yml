name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  coq-kernel-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: "8.20"
          custom_script: |
            startGroup "Environment"
            coqc --version
            python3 --version
            endGroup
            export PYTHONPATH="$PWD/src"
            python3 -m autotrocq.cli generate examples/bool_nat_section.json --out /tmp/autotrocq-quickstart
            python3 -m autotrocq.cli replay /tmp/autotrocq-quickstart/BoolNatSection.v --report /tmp/autotrocq-quickstart/BoolNatSection.replay.json
            python3 -m autotrocq.cli batch artifact/direct-cli-matrix/specs --out /tmp/autotrocq-matrix
