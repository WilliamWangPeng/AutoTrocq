name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  coq-kernel-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: "8.20"
          custom_script: |
            startGroup "Environment"
            coqc --version
            python3 --version
            endGroup
            export PYTHONPATH="$PWD/src"
            rm -rf /tmp/autotrocq-metatheory
            mkdir -p /tmp/autotrocq-metatheory
            cp artifact/metatheory/*.v /tmp/autotrocq-metatheory/
            pushd /tmp/autotrocq-metatheory
            coqc -q AutoTrocqOutcomeSemantics.v
            coqchk -silent AutoTrocqOutcomeSemantics
            coqc -q AutoTrocqComposition.v
            coqchk -silent AutoTrocqComposition
            coqc -q AutoTrocqPredicateTransformers.v
            coqchk -silent AutoTrocqPredicateTransformers
            coqc -q AutoTrocqIntermediateAssertions.v
            coqchk -silent AutoTrocqIntermediateAssertions
            coqc -q AutoTrocqFullAbstraction.v
            coqchk -silent AutoTrocqFullAbstraction
            popd
            python3 scripts/run_composition_policy_audit.py --out /tmp/autotrocq-composition-audit
            python3 scripts/run_predicate_transformer_audit.py --out /tmp/autotrocq-predicate-transformer-audit
            python3 scripts/run_intermediate_assertion_audit.py --out /tmp/autotrocq-intermediate-assertion-audit
            python3 scripts/run_full_abstraction_audit.py --out /tmp/autotrocq-full-abstraction-audit
            python3 -m autotrocq.cli generate examples/bool_nat_section.json --out /tmp/autotrocq-quickstart
            python3 -m autotrocq.cli replay /tmp/autotrocq-quickstart/BoolNatSection.v --report /tmp/autotrocq-quickstart/BoolNatSection.replay.json
            python3 -m autotrocq.cli batch artifact/direct-cli-matrix/specs --out /tmp/autotrocq-matrix
